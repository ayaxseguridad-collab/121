# Fixture SINTÉTICO de manifiesto (variante pnpm), para pruebas de autoridad desde datos.
TF_PROJECT="variante"

## Repo de producto
TF_REPO_URL="https://github.com/org-ejemplo/proyecto-variante-mx.git"
TF_REPO_DIR="Proyecto Variante MX"
TF_GH_ORG="org-ejemplo"

## Identidades (por nombre de variable; los valores viven en el entorno)
TF_GH_TOKEN_NAME="GITHUB_TOKEN"
TF_GH_MERGER_TOKEN_NAMES="GITHUB_TOKEN"
TF_CR_KEY_NAMES="CODERABBIT_API_KEY"
TF_CLAUDE_ACCOUNT_POOL="cuenta-d cuenta-e"
TF_CODEX_ACCOUNT_POOL="cuenta-f"

## Linear
TF_LINEAR_TOKEN_NAME="LINEAR_API_KEY"
TF_LINEAR_TEAM_KEY="XYZ"
TF_LINEAR_PROJECT_ID="00000000-0000-4000-8000-000000000011"
TF_LINEAR_META_INITIATIVE_ID="00000000-0000-4000-8000-000000000012"
TF_LINEAR_COORDINATION_PROJECT_ID="00000000-0000-4000-8000-000000000013"
TF_EXCLUIR_ISSUES="XYZ-1001"

## Gates y datos — 100% LOCALES (lista NOMBRADA, un gate por invocación)
# Variante pnpm: el repo trae pnpm-lock.yaml y pnpm-workspace.yaml.
TF_GATE_IDS="check lint build"
TF_GATE_CMD_check="pnpm exec astro check"
TF_GATE_CMD_lint="pnpm exec biome ci ."
TF_GATE_CMD_build="PUBLIC_TICKETS_URL='https://ejemplo.com/entradas' SITE_URL='https://sitio.ejemplo.invalid' pnpm build"
TF_HANDOFF_GATES="check lint build"                            # gates que el canal corre ANTES de entregar el draft
TF_INSTALL="pnpm install --frozen-lockfile"                    # variante pnpm; el valor por defecto del motor es npm
TF_MIGRATIONS="supabase"                                       # serialización de slots de migración
TF_MIGRATIONS_DIR="supabase/migrations"
TF_DB_GATE="never"
TF_SUPABASE_PROJECT_REF="refsinteticoxxxxxxxx"
TF_SUPABASE_TOKEN_NAME="SUPABASE_ACCESS_TOKEN"
# Tokens EXACTOS del campo `surfaces` del HANDOFF: una palabra cada uno.
TF_SENSITIVE_SURFACES="commerce webhooks edge-functions email migraciones credenciales"
