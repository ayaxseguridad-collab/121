# ~/.codex/config.toml del golden — sembrado por 02-golden.sh (TAL-1552).
# Objetivo: que el CLI del pane de auditoría arranque SIN prompts interactivos que rompan el relay.
#
# 1) Suprime el chequeo de actualización al arrancar. En estos contenedores el update SIEMPRE fallaría
#    (el usuario del carril no tiene permisos sobre el prefix global de npm → EACCES) y mataría el
#    proceso, dejando el pane en un shell; el binario se mantiene root-managed en la última estable.
check_for_update_on_startup = false
#
# El lanzador pasa el modelo y el esfuerzo del auditor desde el registro del usuario.
model_reasoning_effort = "medium"
#
# 2) Siembra la confianza del repo del carril (evita el prompt "trust directory" en cada arranque).
#    El path se renderiza con __CUSER__ / __REPO_DIR__ (mismo patrón que tokens.bashrc.tmpl).
#    El bypass de approvals/sandbox lo aporta el alias de lanzamiento del carril; aquí NO se toca.
[projects."/home/__CUSER__/__REPO_DIR__"]
trust_level = "trusted"
